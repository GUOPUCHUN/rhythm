<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RHYTHM" />
<meta name="theme-color" content="#141210" />
<title>RHYTHM</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans:wght@400;500;700&display=swap" />
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#141210;--panel:#1E1A17;--panel2:#272220;--line:#38312C;
  --text:#EFE7DC;--mute:#9A8B7C;--dim:#6B5F54;
  --blue:#2E56C8;--blue-s:#8AA6F2;
  --amber:#DE9420;--amber-s:#F0BE6C;
  --green:#3E9B5C;--green-s:#7FD09A;
  --brass:#D8A93B;
}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--text);font-family:'Noto Sans',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 110px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0}
h1{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:24px;margin:5px 0 0}
.sub{font-size:12.5px;color:var(--mute);margin:6px 0 0;line-height:1.65}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.sec-t{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.sec-n{font-size:10.5px;color:var(--dim)}

.tb{display:block;width:100%;text-align:left;border:none;border-radius:14px;padding:15px 16px;margin-bottom:9px;cursor:pointer;font-family:inherit;transition:transform .12s ease}
.tb:active{transform:scale(.985)}
.tb .t1{font-size:16px;font-weight:500;line-height:1.35}
.tb .t2{font-size:11.5px;margin-top:5px;opacity:.85;font-family:'IBM Plex Mono',monospace}
.tb.main{background:var(--blue);color:#EAF0FF;padding:18px 16px}
.tb.main .t1{font-size:19px;font-weight:700}
.tb.fixed{background:var(--amber);color:#2A1C05}
.tb.extra{background:var(--green);color:#08210F}
.tb.done{background:transparent;border:1px solid var(--line);color:var(--mute);padding:15px 16px}
.tb.done .t1{font-weight:400;font-size:15px}
.tb.main.done .t1{font-size:16px}
.tb .ck{float:right;font-family:'IBM Plex Mono',monospace;font-size:11px;margin-left:10px}
.tb.main.done .ck{color:var(--blue-s)}
.tb.fixed.done .ck{color:var(--amber-s)}
.tb.extra.done .ck{color:var(--green-s)}
.tb.none{background:transparent;border:1px dashed #453C35;color:var(--dim);cursor:default;text-align:center;padding:16px;font-size:13px;line-height:1.6}
.tb.none:active{transform:none}
.prog{margin-top:10px;background:rgba(255,255,255,.16);border-radius:3px;height:4px;overflow:hidden}
.prog i{display:block;height:100%;background:#EAF0FF;border-radius:3px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.st-b{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:inherit;color:var(--text);text-align:left}
.st-b:active{transform:scale(.985)}
.lv{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 11px;border-radius:20px;white-space:nowrap}
.lvA{background:#1F4A5A;color:#A6DEEE}
.lvB{background:#26402C;color:#A9E0BA}
.lvC{background:#2E2A26;color:#B7AA9B}
.lvD{background:#4A3226;color:#F2C4A4}
.lvE{background:#5A2A2A;color:#FFC9C9}

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,18,16,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;cursor:pointer;padding:6px 2px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--dim);border-radius:8px}
nav button.on{color:var(--brass)}
nav button span{display:block;font-family:'Noto Sans',sans-serif;font-size:12.5px;letter-spacing:0;margin-top:3px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(26px);transition:transform .2s}
.ov.on .sheet{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.sh-t{font-size:17px;font-weight:600;line-height:1.35}
.sh-s{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.6}
.x{background:none;border:1px solid var(--line);color:var(--mute);width:32px;height:32px;min-width:32px;border-radius:50%;font-size:15px;cursor:pointer;line-height:1;font-family:inherit}

label.f{display:block;font-size:11px;color:var(--mute);margin:15px 0 7px}
.row{display:flex;gap:8px;align-items:center}
select,input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8A7C6E 50%),linear-gradient(135deg,#8A7C6E 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
select:focus,input:focus,textarea:focus{border-color:var(--brass)}
textarea{resize:vertical;min-height:70px;line-height:1.6}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.op{font-size:13px;padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;font-family:inherit}
.op.on{border-color:var(--brass);background:rgba(216,169,59,.15);color:#F2DFA8}
.op.neg.on{border-color:#B06A5A;background:rgba(176,106,90,.17);color:#F0BCAE}
.op.pos.on{border-color:#5AA36F;background:rgba(90,163,111,.17);color:#AEE5BF}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 11px;border-radius:9px;border:1px solid var(--green);background:rgba(62,155,92,.14);color:var(--green-s);cursor:pointer;font-family:inherit}
.btn{display:block;width:100%;padding:14px;border-radius:11px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:20px;background:var(--brass);color:#241C0E}
.btn:active{transform:scale(.985)}
.btn.blue{background:var(--blue);color:#EAF0FF}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mute);font-weight:400;font-size:13px;padding:11px;margin-top:9px}
.btn.sm{margin-top:9px;padding:11px;font-size:13px;font-weight:500;background:transparent;border:1px dashed #453C35;color:var(--mute)}
.btn:disabled{opacity:.34}
.fold{width:100%;background:none;border:1px dashed #453C35;border-radius:10px;color:var(--mute);padding:12px;font-size:12.5px;font-family:inherit;cursor:pointer;margin-top:15px}

.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-h button{background:none;border:1px solid var(--line);color:var(--mute);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.cal-h .m{font-family:'IBM Plex Mono',monospace;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-family:'IBM Plex Mono',monospace;font-size:9px;text-align:center;color:var(--dim);padding-bottom:3px}
.cd{aspect-ratio:1/1.15;border:1px solid transparent;border-radius:9px;background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:5px 2px 4px;cursor:pointer;font-family:inherit}
.cd.pad{background:none;cursor:default}
.cd.today{border-color:var(--brass)}
.cd .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text)}
.cd.out .n{color:#4A423A}
.cd .dots{display:flex;gap:2.5px;margin-top:4px;height:5px}
.cd .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cd .lvbar{margin-top:auto;width:62%;height:3px;border-radius:2px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:none}
.kv .k{color:var(--mute)}
.kv .v{font-family:'IBM Plex Mono',monospace;text-align:right}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item .n1{font-size:14.5px}
.item .n2{font-size:11px;color:var(--dim);margin-top:3px;font-family:'IBM Plex Mono',monospace}
.mini{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 11px;border-radius:8px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.mini.red{border-color:#6B4038;color:#D99A8A}
.empty{color:var(--mute);font-size:13px;line-height:1.75;margin:0}
.big{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:var(--text)}
.big .b1{font-size:15.5px;font-weight:500}
.big .b2{font-size:11.5px;color:var(--mute);margin-top:4px}
.back{background:none;border:none;color:var(--mute);font-size:14px;cursor:pointer;padding:0;margin-bottom:14px;font-family:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:var(--brass);color:#241C0E;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.install{border:1px dashed #453C35;border-radius:12px;padding:12px 14px;margin-top:16px}
.install p{margin:0;font-size:12px;line-height:1.7;color:var(--mute)}
.install b{color:#F2DFA8;font-weight:500}
.rate{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rate:first-child{border-top:none}
.rate .rl{font-size:14px;flex:1}
.rate .rn{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--brass);width:52px;text-align:right}
.rate select{width:112px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<nav id="nav"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   RHYTHM v1.1
   ========================================================= */

var KEY='rhythm:v1';
var WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var WD2=['M','T','W','T','F','S','S'];
var KINDN={main:'Main',fixed:'Fixed',extra:'Extra'};

var MOOD=[['Sad',-2],['A bit sad',-1],['Normal day',0],['A bit happy',1],['Happy',2]];
var MENTAL=[['Upset',-1],['Sorrowful',-1],['Lonely',-1],['Anxious',-1],['Empty',-1],['Calm',0],['Fulfilled',1],['Joyful',1],['Satisfied',1],['Happy',1]];
var BODY=[['Headache',-1],['Sleepy',-1],['Tired',-1],['Distracted',-1],['Unwell',-1],['Normal',0],['Energetic',1],['Focused',1],['Well-rested',1]];
var SOLO={'Calm':'mental','Normal':'body'};

var LEVELS=[{min:3,c:'A',label:'Excellent'},{min:1,c:'B',label:'Good'},{min:0,c:'C',label:'Normal'},{min:-2,c:'D',label:'Poor'},{min:-99,c:'E',label:'Awful'}];

var S=null, TAB='today', SUB=null, EDIT=null, CAL=null, DRAFT=null, SHEET=null, FORM=null;

/* ---------- storage ---------- */
function blank(){ return {v:2,mains:[],archive:[],fixed:[],extra:[],logs:{}}; }
function migrate(d){
  d=Object.assign(blank(),d||{});
  if(d.main){ if(!d.mains.length) d.mains=[d.main]; delete d.main; }
  if(!Array.isArray(d.mains)) d.mains=[];
  d.extra.forEach(function(t){ if(!t.dates){ t.dates=[]; } delete t.days; });
  // Map old unit data seamlessly if it exists
  if(d.mains){ d.mains.forEach(t=>{ if(t.unit==='小时') t.unit='h'; if(t.unit==='次') t.unit='times'; }); }
  if(d.fixed){ d.fixed.forEach(t=>{ if(t.unit==='小时') t.unit='h'; if(t.unit==='次') t.unit='times'; }); }
  if(d.extra){ d.extra.forEach(t=>{ if(t.unit==='小时') t.unit='h'; if(t.unit==='次') t.unit='times'; }); }
  if(d.logs){ Object.values(d.logs).forEach(l=>{ if(l.tasks){ Object.values(l.tasks).forEach(r=>{ if(r.unit==='小时') r.unit='h'; if(r.unit==='次') r.unit='times'; }); } }); }
  d.v=2;
  return d;
}
function localGet(){ try{ var v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function load(cb){
  var done=function(d){ cb(migrate(d)); };
  if(window.storage&&window.storage.get){
    window.storage.get(KEY).then(function(r){
      try{ done(r&&r.value?JSON.parse(r.value):localGet()); }catch(e){ done(localGet()); }
    }).catch(function(){ done(localGet()); });
  } else done(localGet());
}
function save(){
  var s=JSON.stringify(S);
  try{ localStorage.setItem(KEY,s); }catch(e){ toast('Storage full, export backup first'); }
  if(window.storage&&window.storage.set){ try{ window.storage.set(KEY,s).catch(function(){}); }catch(e){} }
}

/* ---------- utils ---------- */
function k(d){ return d.toLocaleDateString('sv-SE'); }
function wd(d){ return (d.getDay()+6)%7; }
function today(){ return new Date(); }
function tk(){ return k(today()); }
function parseD(s){ return new Date(s+'T00:00:00'); }
function diffDays(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(Math.floor(d.getMinutes()/5)*5); }
function addHM(hm,mins){ var p=hm.split(':'),t=(+p[0])*60+(+p[1])+mins; t=((t%1440)+1440)%1440; return pad(Math.floor(t/60))+':'+pad(t%60); }
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.className='toast show'; setTimeout(function(){e.className='toast';},1700); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function md(ds){ return ds.slice(5).replace('-','/'); }

function logOf(d){ if(!S.logs[d]) S.logs[d]={tasks:{},status:null,rating:null}; if(!S.logs[d].tasks) S.logs[d].tasks={}; return S.logs[d]; }
function rec(d,id){ var l=S.logs[d]; return (l&&l.tasks)?l.tasks[id]:null; }
function allTasks(){ return S.mains.concat(S.fixed,S.extra); }
function findTask(id){ return allTasks().filter(function(x){return x.id===id;})[0]; }
function fmtAmt(r){
  if(!r) return '';
  if(r.unit==='h' || r.unit==='小时'){ var h=Math.floor(r.amount/60),m=r.amount%60; return (h?h+'h':'')+((m||!h)?m+'m':''); }
  return r.amount+' times';
}
function toNum(r){ return (r.unit==='h' || r.unit==='小时')? r.amount/60 : r.amount; }
function fmtPlan(v,t){ return (Math.round(v*10)/10)+((t.unit==='h' || t.unit==='小时')?'h':' times'); }

function primaryMain(){
  if(!S.mains.length) return null;
  return S.mains.slice().sort(function(a,b){ return a.due<b.due?-1:a.due>b.due?1:0; })[0];
}
function tasksFor(date){
  var out=[], w=wd(parseD(date));
  S.mains.forEach(function(t){ if(date<=t.due || rec(date,t.id)) out.push({kind:'main',t:t}); });
  out.sort(function(a,b){ return a.t.due<b.t.due?-1:1; });
  S.fixed.forEach(function(t){ if(t.days.indexOf(w)>=0) out.push({kind:'fixed',t:t}); });
  S.extra.forEach(function(t){ if(t.dates.indexOf(date)>=0 || rec(date,t.id)) out.push({kind:'extra',t:t}); });
  return out;
}
function totalFor(id){ var s=0; for(var d in S.logs){ var r=rec(d,id); if(r) s+=toNum(r); } return s; }
function weekTotal(id,date){
  var d=parseD(date), s=0, mon=new Date(d);
  mon.setDate(mon.getDate()-wd(d));
  for(var i=0;i<7;i++){ var x=new Date(mon); x.setDate(mon.getDate()+i); var r=rec(k(x),id); if(r) s+=toNum(r); }
  return s;
}

function scoreOf(d){
  var s=0;
  MOOD.forEach(function(o){ if(o[0]===d.mood) s+=o[1]; });
  MENTAL.forEach(function(o){ if((d.mental||[]).indexOf(o[0])>=0) s+=o[1]; });
  BODY.forEach(function(o){ if((d.body||[]).indexOf(o[0])>=0) s+=o[1]; });
  return s;
}
function levelOf(sc){ for(var i=0;i<LEVELS.length;i++) if(sc>=LEVELS[i].min) return LEVELS[i]; return LEVELS[4]; }

function render(){
  document.getElementById('app').innerHTML =
    TAB==='today'? viewToday() : TAB==='review'? viewReview() : viewPlan();
  var tabs=[['today','01','Today'],['review','02','Review'],['plan','03','Schedule']];
  document.getElementById('nav').innerHTML=tabs.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+'<span>'+t[2]+'</span></button>';
  }).join('');
}

/* ---------------- Today ---------------- */
function viewToday(){
  var date=tk(), l=S.logs[date]||{tasks:{},status:null,rating:null};
  var h='<header><p class="eyebrow">'+date+' · '+WD[wd(today())]+'</p><h1>Today</h1></header>'+installHTML();

  var m=primaryMain();
  h+='<div class="sec"><div class="sec-h"><span class="sec-t" style="color:var(--blue-s)">Main Task</span>'+
     '<span class="sec-n">'+(S.mains.length>1? 'Total '+S.mains.length+' · Nearest deadline':'Nearest deadline')+'</span></div>';
  if(!m){
    h+='<div class="tb none">No main tasks<br>Go to Schedule to add one</div>';
  } else {
    var r=rec(date,m.id), left=diffDays(date,m.due), done=totalFor(m.id);
    var pct=m.planned?clamp(done/m.planned*100,0,100):0;
    var need=(left>0&&m.planned>done)?((m.planned-done)/left):0;
    if(r){
      h+='<button class="tb main done" data-task="'+m.id+'|main"><span class="ck">✓ '+fmtAmt(r)+' · '+r.start+'</span>'+
         '<div class="t1">'+esc(m.title)+'</div><div class="t2">Recorded today · Tap to edit</div></button>';
    } else {
      h+='<button class="tb main" data-task="'+m.id+'|main"><div class="t1">'+esc(m.title)+'</div>'+
         '<div class="t2">'+(left<0?'Overdue by '+(-left)+' days':left===0?'Due today':left+' days left')+' · '+m.due+'</div>'+
         '<div class="prog"><i style="width:'+pct+'%"></i></div>'+
         '<div class="t2">'+fmtPlan(done,m)+' / '+fmtPlan(m.planned,m)+(need>0?' · Need '+fmtPlan(need,m)+'/day':'')+'</div></button>';
    }
    if(left<0) h+='<div class="tb none" style="border-color:#6B4038;color:#D99A8A">This main task is overdue. Archive it in Schedule -> Manage Tasks to show the next one.</div>';
  }
  h+='</div>';

  h+=block(date,'fixed','Fixed Tasks','var(--amber-s)','No fixed tasks today');
  h+=block(date,'extra','Extra Tasks','var(--green-s)','No extra tasks today');

  var st=l.status, lv=st?levelOf(st.score):null;
  h+='<div class="sec"><div class="sec-h"><span class="sec-t" style="color:var(--brass)">Today\'s State</span>'+
     '<span class="sec-n">'+(st?'Editable today':'Once a day')+'</span></div>'+
     '<button class="st-b" data-status="'+date+'"><span>'+
     (st? 'Recorded · Total '+(st.score>0?'+':'')+st.score : 'Not recorded today')+
     '<br><span style="font-size:11.5px;color:var(--dim)">'+
     (st? (esc((st.note||'').slice(0,26))||'Tap to view or edit') : 'Mood is required, others are optional')+
     '</span></span>'+
     (lv?'<span class="lv lv'+lv.c+'">'+lv.label+'</span>':'<span class="lv lvC">None</span>')+'</button></div>';

function lvColor(c){ return {A:'#5FC6E0',B:'#7FD09A',C:'#8A7C6E',D:'#D9A07E',E:'#E07A7A'}[c]; }

function monthSummary(y,mo){
  var mainH=0,mainC=0,fixedN=0,extraN=0,scores=[],cnt={},selfs=[],others=[];
  var n=new Date(y,mo+1,0).getDate();
  for(var day=1;day<=n;day++){
    var l=S.logs[y+'-'+pad(mo+1)+'-'+pad(day)]; if(!l) continue;
    for(var id in (l.tasks||{})){
      var r=l.tasks[id];
      if(r.kind==='main'){ if(r.unit==='h' || r.unit==='小时') mainH+=r.amount/60; else mainC+=r.amount; }
      else if(r.kind==='fixed') fixedN++;
      else extraN++;
    }
    if(l.status){
      scores.push(l.status.score);
      (l.status.mental||[]).concat(l.status.body||[]).forEach(function(o){ cnt[o]=(cnt[o]||0)+1; });
    }
    if(l.rating){
      if(l.rating.self!==null&&l.rating.self!==undefined) selfs.push(l.rating.self);
      if(l.rating.other!==null&&l.rating.other!==undefined) others.push(l.rating.other);
    }
  }
  var avg=function(a){ return a.length? Math.round(a.reduce(function(x,y){return x+y;},0)/a.length*10)/10 : null; };
  var sAvg=scores.length? scores.reduce(function(a,b){return a+b;},0)/scores.length : null;
  var lv=sAvg===null?null:levelOf(Math.round(sAvg));
  var top=null,tn=0; for(var o in cnt) if(cnt[o]>tn){ top=o; tn=cnt[o]; }

  var mainTxt=[];
  if(mainH) mainTxt.push((Math.round(mainH*10)/10)+' h');
  if(mainC) mainTxt.push(mainC+' times');

  var h='<div class="sec"><div class="sec-h"><span class="sec-t">Monthly Summary</span>'+
    '<span class="sec-n">'+scores.length+' days recorded</span></div><div class="card">'+
    kv('Main tasks done', mainTxt.length?mainTxt.join(' + '):'—')+
    kv('Fixed tasks done','Total '+fixedN+' times')+
    kv('Extra tasks done','Total '+extraN+' times')+
    kv('Overall state', lv? lv.label+' (Avg '+(Math.round(sAvg*10)/10)+')':'—')+
    kv('Most frequent state', top? top+' ('+tn+' times)':'—')+
    kv('Avg Self Rating', avg(selfs)!==null? avg(selfs)+' / 10 ('+selfs.length+' days)':'—')+
    kv('Avg Others Rating', avg(others)!==null? avg(others)+' / 10 ('+others.length+' days)':'—')+
    '</div></div>';

  if(S.mains.length){
    h+='<div class="sec"><div class="sec-h"><span class="sec-t">Main Task Progress</span></div><div class="card">';
    S.mains.slice().sort(function(a,b){return a.due<b.due?-1:1;}).forEach(function(m){
      var left=diffDays(tk(),m.due);
      h+=kv(esc(m.title), fmtPlan(totalFor(m.id),m)+' / '+fmtPlan(m.planned,m)+'　'+(left>=0?left+' days left':'Overdue'));
    });
    h+='</div></div>';
  }

  h+='<div class="sec"><div class="card"><p class="empty">Data is stored locally. Copy it to backup before clearing cache or switching devices.</p>'+
     '<div style="display:flex;gap:8px;margin-top:12px"><button class="mini" data-act="export">Copy all data</button>'+
     '<button class="mini" data-act="import">Paste to restore</button></div></div></div>';
  return h;
}

    '<div class="sh-s">'+(date===tk()?'Today':'Can be backfilled')+'</div></div><button class="x" data-act="close">✕</button></div>';
  if(!list.length) h+='<p class="empty">No tasks scheduled for this day.</p>';
  list.forEach(function(x){
    var r=rec(date,x.t.id);
    var col={main:'var(--blue-s)',fixed:'var(--amber-s)',extra:'var(--green-s)'}[x.kind];
    h+='<div class="item"><div><div class="n1" style="color:'+col+'">'+esc(x.t.title)+'</div>'+
      '<div class="n2">'+(r? fmtAmt(r)+' · '+r.start+(r.end?'–'+r.end:'') : 'Not recorded')+'</div></div>'+
      '<button class="mini" data-task="'+x.t.id+'|'+x.kind+'|'+date+'">'+(r?'Edit':'Backfill')+'</button></div>';
  });
  h+='<div class="item"><div><div class="n1">Today\'s State</div><div class="n2">'+
    (st? 'Total '+(st.score>0?'+':'')+st.score+' · '+lv.label : 'Not recorded')+'</div></div>'+
    '<button class="mini" data-status="'+date+'">'+(st?'View':'Backfill')+'</button></div>';
  h+='<label class="f">Today\'s Rating</label>'+ratingCard(date,rt);
  openSheet(h);
}

document.addEventListener('change',function(e){
  var el=e.target.closest('[data-rate]'); if(!el) return;
  var p=el.dataset.rate.split('|'), date=p[0], which=p[1];
  var l=logOf(date);
  if(!l.rating) l.rating={self:null,other:null};
  l.rating[which] = el.value===''? null : +el.value;
  save();
  if(document.getElementById('ov').classList.contains('on')) daySheet(date);
  else render();
});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-tab],[data-task],[data-status],[data-day],[data-mv],[data-sub],[data-edit],[data-del],[data-arch],[data-day7],[data-rmdate],[data-mood],[data-mental],[data-body],[data-act]');
  if(!el) return;
  var a=el.dataset;

  if(a.tab){ TAB=a.tab; SUB=null; EDIT=null; FORM=null; render(); return; }
  if(a.task!==undefined){ var p=a.task.split('|'); taskSheet(p[2]||tk(),p[0],p[1]); return; }
  if(a.status!==undefined){ statusSheet(a.status); return; }
  if(a.day!==undefined){ daySheet(a.day); return; }
  if(a.mv){ CAL=new Date(CAL.getFullYear(),CAL.getMonth()+(+a.mv),1); render(); return; }

  if(a.sub!==undefined){ SUB=a.sub||null; EDIT=null; FORM=null; if(SUB&&SUB!=='manage') initForm(); render(); return; }
  if(a.edit){
    var q=a.edit.split('|'), grp=q[0];
    TAB='plan'; SUB = grp==='mains'?'main':grp;
    EDIT = S[grp].filter(function(x){return x.id===q[1];})[0];
    FORM=null; initForm(); render(); return;
  }
  if(a.del){
    var q2=a.del.split('|');
    if(!confirm('Delete task? Recorded history remains.')) return;
    S[q2[0]]=S[q2[0]].filter(function(x){return x.id!==q2[1];});
    save(); render(); toast('Deleted'); return;
  }
  if(a.arch){
    var m=S.mains.filter(function(x){return x.id===a.arch;})[0];
    if(!m||!confirm('Archive "'+m.title+'"? History remains in Review.')) return;
    S.archive.push(Object.assign({},m,{done:totalFor(m.id)}));
    S.mains=S.mains.filter(function(x){return x.id!==a.arch;});
    save(); render(); toast('Archived'); return;
  }
  if(a.day7!==undefined){ el.classList.toggle('on'); return; }
  if(a.rmdate!==undefined){
    pullForm();
    FORM.dates=FORM.dates.filter(function(d){return d!==a.rmdate;});
    render(); return;
  }
  if(a.mood!==undefined){ pullNote(); DRAFT.mood=a.mood; drawStatus(); return; }
  if(a.mental!==undefined){ pullNote(); pick(DRAFT.mental,a.mental,'mental'); drawStatus(); return; }
  if(a.body!==undefined){ pullNote(); pick(DRAFT.body,a.body,'body'); drawStatus(); return; }

  switch(a.act){
    case 'close': closeSheet(); break;
    case 'unfold': pullNote(); DRAFT.open=true; drawStatus(); break;
    case 'save-rec': saveRec(); break;
    case 'del-rec':
      delete logOf(SHEET.date).tasks[SHEET.id];
      save(); closeSheet(); render(); toast('Record canceled'); break;
    case 'save-status': {
      pullNote();
      var sc=scoreOf(DRAFT);
      logOf(SHEET.date).status={mood:DRAFT.mood,mental:DRAFT.mental,body:DRAFT.body,note:DRAFT.note,score:sc,level:levelOf(sc).label};
      save(); closeSheet(); render(); toast('Submitted · '+levelOf(sc).label); break;
    }
    case 'add-date': {
      pullForm();
      var v=document.getElementById('f_newdate').value;
      if(!v){ toast('Select a date first'); return; }
      if(FORM.dates.indexOf(v)<0) FORM.dates.push(v); else toast('Date already added');
      render(); break;
    }
    case 'save-task': saveTask(); break;
    case 'export': {
      var s=JSON.stringify(S);
      if(navigator.clipboard) navigator.clipboard.writeText(s).then(function(){toast('Copied, paste it in notes');},function(){toast('Browser does not support copy');});
      else toast('Browser does not support copy');
      break;
    }
    case 'import': {
      var v2=prompt('Paste previously copied data here');
      if(!v2) return;
      try{ S=migrate(JSON.parse(v2)); save(); render(); toast('Restored'); }
      catch(err){ toast('Failed to read data'); }
      break;
    }
  }
});

function pick(arr,val,group){
  var i=arr.indexOf(val);
  if(i>=0){ arr.splice(i,1); return; }
  if(SOLO[val]===group){ arr.length=0; arr.push(val); return; }
  for(var s in SOLO){ if(SOLO[s]===group){ var j=arr.indexOf(s); if(j>=0) arr.splice(j,1); } }
  arr.push(val);
}

function saveTask(){
  pullForm();
  var title=(FORM.title||'').trim(), planned=parseFloat(FORM.planned), unit=FORM.unit;
  if(!title){ toast('Fill in task name first'); return; }
  if(isNaN(planned)||planned<=0){ toast('Planned amount must be > 0'); return; }

  if(SUB==='main'){
    if(!FORM.due){ toast('Main task must have a deadline'); return; }
    if(EDIT&&EDIT.id) Object.assign(EDIT,{title:title,due:FORM.due,planned:planned,unit:unit});
    else S.mains.push({id:uid(),title:title,due:FORM.due,planned:planned,unit:unit,created:tk()});
  } else if(SUB==='extra'){
    if(!FORM.dates.length){ toast('Add at least one date'); return; }
    var dates=FORM.dates.slice().sort();
    if(EDIT&&EDIT.id) Object.assign(EDIT,{title:title,dates:dates,planned:planned,unit:unit});
    else S.extra.push({id:uid(),title:title,dates:dates,planned:planned,unit:unit});
  } else {
    if(!FORM.days.length){ toast('Select at least one day'); return; }
    if(EDIT&&EDIT.id) Object.assign(EDIT,{title:title,days:FORM.days,planned:planned,unit:unit});
    else S.fixed.push({id:uid(),title:title,days:FORM.days,planned:planned,unit:unit});
  }
  save(); EDIT=null; SUB=null; FORM=null; TAB='today'; render(); toast('Saved');
}

function isStandalone(){
  return window.navigator.standalone===true ||
    (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
}
function installHTML(){
  if(isStandalone()) return '';
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  return '<div class="install"><p>'+(ios?'Tap <b>Share</b> below → <b>Add to Home Screen</b> to use.':'<b>Add to Home Screen</b> to use.')+
    '<br>Safari tab data clears after 7 days of inactivity. Home Screen app is exempt.</p></div>';
}
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
document.getElementById('ov').addEventListener('click',function(e){ if(e.target.id==='ov') closeSheet(); });

load(function(d){ S=d; render(); });
</script>
